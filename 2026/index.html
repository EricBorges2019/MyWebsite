    <main>
        <p>This is for what's coming next.</p>
        
        <script type="module">
        import WebTorrent from 'https://esm.sh/webtorrent'


            const client = new WebTorrent()
            const torrentId = 'magnet:?xt=urn:btih:9f29dc8b1d11604925ee6fe18071db669d6c312a&dn=plan-9-from-outer-space_202009&tr=http%3A%2F%2Fbt1.archive.org%3A6969%2Fannounce&tr=http%3A%2F%2Fbt2.archive.org%3A6969%2Fannounce&ws=http://ia601908.us.archive.org/6/items/&ws=http://ia801908.us.archive.org/6/items/&ws=https://archive.org/download/'
            
            navigator.serviceWorker.register('sw.min.js')
            const controller = await navigator.serviceWorker.ready
            client.createServer({ controller })

            client.add(torrentId, torrent => {
  // Torrents can contain many files. Let's use the .mp4 file
  const file = torrent.files.find(file => {
    return file.name.endsWith('.mp4')
  })

  // Display the file by adding it to the DOM.
  // Supports video, audio, image files, and more!
  file.streamTo(document.querySelector('video'))
})
            </script>
